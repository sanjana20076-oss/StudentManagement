
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
</head>
<body>

    <h2>Student Registration</h2>

    <form method="POST">
        <input
            type="text"
            name="name"
            placeholder="Student Name"
            required
        >
        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >
        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password (minimum 8 characters)"
            minlength="8"
            required
        >
        <br><br>

        <input
            type="text"
            name="department"
            placeholder="Department"
            required
        >
        <br><br>

        <button type="submit">Register</button>
    </form>

    <br>

    <a href="/">Home</a>

</body>
</html>
